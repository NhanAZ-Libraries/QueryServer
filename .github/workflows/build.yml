name: Build and validate QueryServer

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze callbacks and build plugin PHAR
    runs-on: ubuntu-24.04
    steps:
      - name: Check out QueryServer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955 # 5.49.1
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false

      - name: Check out Axolotl PHP setup helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .devtools-dependencies/setup-php-action
          persist-credentials: false

      - name: Set up Axolotl PHP environment
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.1"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node .devtools-dependencies/setup-php-action/dist/index.js

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Test callback flow and UDP query transport
        run: |
          php tests/callback-flow.php
          php tests/udp-query.php

      - name: Lint plugin, consumer and fixture PHP
        shell: bash
        run: find src examples tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Analyze and build with pinned DevTools
        id: build
        uses: NhanAZ/DevTools@6606444fc32787a3e50275fdb668c2310e899740 # v1.0.3
        with:
          project: .
          output: build
          phpstan: max
          phpstan-server: .devtools-dependencies/axolotl-pm

      - name: Verify PHAR entries and SHA-256 digest
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          PHAR_SHA256: ${{ steps.build.outputs.sha256 }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$PHAR_PATH" | cut -d ' ' -f 1)" = "$PHAR_SHA256"
          php -r '$p=new Phar(getenv("PHAR_PATH")); foreach(["plugin.yml","LICENSE","resources/licenses/libpmquery-LICENSE.txt","src/Main.php","src/API.php","src/libpmquery/PMQuery.php"] as $f){if(!$p->offsetExists($f)){throw new RuntimeException("Missing PHAR entry: ".$f);}}'
          cp "$BUILD_METADATA" build/build-metadata.json

      - name: Analyze and build example consumer with pinned DevTools
        id: consumer
        uses: NhanAZ/DevTools@6606444fc32787a3e50275fdb668c2310e899740 # v1.0.3
        with:
          project: examples/QueryConsumer
          output: build/consumer
          phpstan: max
          phpstan-server: .devtools-dependencies/axolotl-pm
          phpstan-paths: src

      - name: Verify example consumer PHAR
        shell: bash
        env:
          PHAR_PATH: ${{ steps.consumer.outputs.phar }}
          PHAR_SHA256: ${{ steps.consumer.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$PHAR_PATH" | cut -d ' ' -f 1)" = "$PHAR_SHA256"
          php -r '$p=new Phar(getenv("PHAR_PATH")); foreach(["plugin.yml","src/Example/QueryConsumer/Main.php"] as $f){if(!$p->offsetExists($f)){throw new RuntimeException("Missing example PHAR entry: ".$f);}}'

      - name: Upload verified plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QueryServer-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.phar }}
            build/build-metadata.json
          if-no-files-found: error
          retention-days: 14
